<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — GS-Tracker 高盛动向情报系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Serif+SC:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f5f0;
  --paper-dark:#efeae2;
  --surface:#ffffff;
  --ink:#1c1c1c;
  --ink-muted:#6b6560;
  --rule:#d9d3c8;
  --accent:#e05a45;
  --accent-soft:#f7e3df;
  --serif:'Noto Serif SC',serif;
  --sans:'Inter Tight','Noto Sans SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#e5e0d6}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;line-height:1.6}
.topbar{width:100%;border-bottom:1px solid var(--rule);padding:10px 24px;font-size:.68rem;letter-spacing:.08em;color:var(--ink-muted);display:flex;justify-content:space-between;text-transform:uppercase}
.masthead{width:100%;padding:34px 24px 26px;text-align:center;border-bottom:1px solid var(--rule);background:linear-gradient(180deg,var(--paper) 0%,var(--paper-dark) 100%)}
.masthead .mark{font-size:1.4rem;margin-bottom:8px;opacity:.7}
.masthead .title{font-family:var(--serif);font-size:2.8rem;font-weight:600;letter-spacing:.06em;line-height:1}
.masthead .sub{font-size:.82rem;color:var(--ink-muted);margin-top:10px;letter-spacing:.04em}
.masthead .date{font-size:.72rem;color:var(--ink-muted);margin-top:14px;letter-spacing:.1em}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;width:100%}
.login-card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.05);width:100%;max-width:420px;padding:40px}
.card-kicker{font-size:.7rem;font-weight:600;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
.login-card h1{font-family:var(--serif);font-size:1.6rem;font-weight:600;margin-bottom:8px;line-height:1.2}
.login-card .lead{font-size:.9rem;color:var(--ink-muted);margin-bottom:28px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.72rem;font-weight:600;color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;padding:11px 14px;border:1px solid var(--rule);border-radius:4px;font-size:.9rem;font-family:var(--sans);color:var(--ink);background:#fff;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.error-msg{display:none;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:10px 12px;font-size:.82rem;margin-bottom:16px}
.error-msg.show{display:block}
.login-btn{width:100%;padding:13px 0;border:none;border-radius:24px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:opacity .15s}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.55;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--ink-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:repeating-linear-gradient(to right,var(--rule) 0,var(--rule) 4px,transparent 4px,transparent 8px)}
.hint{font-size:.78rem;color:var(--ink-muted);line-height:1.7;text-align:center}
.footer{width:100%;text-align:center;padding:20px;font-size:.68rem;color:var(--ink-muted);letter-spacing:.04em;border-top:1px solid var(--rule)}
@media(max-width:600px){
  .masthead .title{font-size:2rem}
  .login-card{padding:28px}
}
</style>
</head>
<body>
<div class="topbar">
  <span>Vol. 026 · Issue 07</span>
  <span>2026 · 北京</span>
  <span>仅供学习参考 · 不构成投资建议</span>
</div>
<header class="masthead" data-od-id="login-masthead">
  <div class="mark">◉</div>
  <div class="title">GS-Tracker</div>
  <div class="sub">高盛动向情报系统 · Goldman Sachs Intelligence</div>
  <div class="date">2026年7月29日 · 星期三 · 第 026 期</div>
</header>
<div class="login-wrap">
  <div class="login-card" data-od-id="login-card">
    <div class="card-kicker">Member Access</div>
    <h1>登录你的情报账户</h1>
    <p class="lead">请输入用户名和密码，进入每日情报与季度报告。</p>
    <div id="error" class="error-msg"></div>
    <form id="login-form">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="yourname" required autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button id="login-btn" class="login-btn" type="submit">登 录</button>
    </form>
    <div class="divider">Note</div>
    <p class="hint">本系统仅用于学习和信息参考，不构成任何投资建议。<br>投资有风险，决策需谨慎。</p>
  </div>
</div>
<footer class="footer">
  GS-Tracker v1.0 · 数据来源 SEC EDGAR / RSS · 本内容仅供学习参考
</footer>
<script>
const form=document.getElementById('login-form');
const errorBox=document.getElementById('error');
const btn=document.getElementById('login-btn');
form.addEventListener('submit',async(e)={
  e.preventDefault();
  errorBox.classList.remove('show');
  btn.disabled=true;
  btn.textContent='登录中…';
  setTimeout(()={
    btn.disabled=false;
    btn.textContent='登 录';
    errorBox.textContent='演示模式：登录接口未连接';
    errorBox.classList.add('show');
  },800);
});
</script>
</body>
</html>
