<template id="guideTpl">
<div class="guide-doc">
    <div class="guide-hero">
        <h2>系统使用指南</h2>

        <div class="guide-toc">

    <div class="card" id="g-what">
        <h3>一、这个系统是干什么的？</h3>
        <p>一句话：<strong>自动盯着高盛、摩根大通等外资机构在公开市场上的各种动作，每天汇总成一份中文情报送到你眼前。</strong></p>
        <p>美国证监会（SEC）要求像高盛这样的大机构定期公开披露大量信息，比如买了哪些股票、公司发生了什么大事。这些信息虽然公开，但分散在不同网站、全是英文、格式晦涩。本系统会自动把它们抓回来，由 AI 筛选出重要内容并翻译成中文，整理成你每天花几分钟就能看完的情报日报。</p>
        <div class="warn">所有信息都来自公开渠道，且存在不同程度的滞后；本系统仅供学习参考，<strong>不构成任何投资建议</strong>。</div>
    </div>

    <div class="card" id="g-start">
        <h3>二、三分钟快速上手</h3>
        <ol>
            <li><strong>打开网页</strong>，默认就是「每日情报」页：最上面是 AI 自动生成的今日日报，下面是一条一条的原始信号。</li>
            <li>今天还没有情报？点左侧边栏的 <strong>「运行每日情报」</strong>，等一两分钟，页面会自动刷新出结果。</li>
            <li><strong>高优先级信号</strong>的 AI 解读会自动生成并直接展示；其它信号感兴趣就点卡片上的 <strong>「AI 解读」</strong>，AI 会用中文解释这条消息意味着什么。</li>
            <li>想看高盛上个季度到底买了什么股票？点左侧 <strong>「季度报告」</strong>。</li>
            <li>手机上也能用：点左上角 <strong>☰</strong> 展开同样的菜单，功能完全一致。</li>
        </ol>
    </div>

    <div class="card" id="g-sources">
        <h3>三、信号源科普（重点）</h3>
        <p>系统的情报来自多个「信号源」，左侧边栏的「信号筛选」里可以按来源勾选/取消。下面逐一解释每个来源是什么意思。</p>

        <h4><span class="src-tag t13f">13F</span>13F 持仓 —— 高盛每个季度买了什么股票</h4>
        <p><strong>是什么：</strong>SEC 规定，凡是管理资产超过 1 亿美元的投资机构，每个季度结束后都必须提交一份叫「13F」的表格，如实列出自己持有的全部美股（哪些公司、多少股、值多少钱）。高盛也必须提交。</p>
        <p><strong>有什么用：</strong>这是唯一能直接看到「高盛买了什么」的官方渠道。对比前后两个季度的 13F，就能看出它在加仓什么、抛售什么。</p>
        <div class="warn">两个重要局限：① <strong>滞后最长 45 天</strong>——比如一季度的持仓最晚 5 月 15 日才披露，你看到的是一两个月前的动作；② 13F 只包含<strong>美股多头持仓</strong>，看不到做空、债券、期权等操作。所以它适合观察中长期布局，不适合抄短线作业。</div>

        <h4><span class="src-tag t8k">8-K</span>SEC 8-K —— 公司突发大事的「官方快讯」</h4>
        <p><strong>是什么：</strong>上市公司一旦发生重大事件，必须在 <strong>4 个工作日</strong>内向 SEC 提交一份「8-K」临时报告。所谓重大事件包括：高管辞职或上任、并购收购、财报发布、债务违约、退市风险等。</p>
        <p><strong>有什么用：</strong>8-K 相当于公司突发新闻的「官方版本」，比媒体报道更权威、更及时。系统会盯住高盛自身及关联公司的 8-K，一有大事你马上就能看到。</p>

        <h4><span class="src-tag t13d">13D/13G</span>13D / 13G —— 大股东「举牌」公告</h4>
        <p><strong>是什么：</strong>任何投资者买入某家上市公司超过 <strong>5%</strong> 的股份，都必须向 SEC 公开申报，俗称「举牌」。申报分两种：</p>
        <ul>
            <li><strong>13D（积极投资）</strong>：买方打算干预公司经营（比如要求更换管理层、推动并购），必须在 10 天内申报。出现 13D 通常意味着「大事要发生」。</li>
            <li><strong>13G（被动投资）</strong>：买方只是单纯财务投资、不打算插手管理，申报期限更宽松。高盛这类机构的大部分持仓走的就是 13G。</li>
        </ul>
        <p><strong>有什么用：</strong>当高盛对某家公司的持股突破 5% 时，13D/13G 能比 13F 更早暴露它的重仓动作，是弥补 13F 滞后的重要补充。</p>

        <h4>三个 SEC 信号源对比</h4>
        <table>
            <tr><th>信号源</th><th>回答的问题</th><th>披露频率</th><th>时效性</th></tr>
            <tr><td><strong>13F</strong></td><td>高盛整体持仓长什么样？</td><td>每季度一次</td><td>滞后最长 45 天</td></tr>
            <tr><td><strong>8-K</strong></td><td>公司出了什么突发大事？</td><td>事件发生后 4 个工作日内</td><td>很及时</td></tr>
            <tr><td><strong>13D/13G</strong></td><td>谁在重仓（超过 5%）某公司？</td><td>突破 5% 后申报（13D 为 10 天内）</td><td>较及时</td></tr>
        </table>

        <h4>其他信号源</h4>
        <ul>
            <li><strong>高盛研究</strong>：高盛官方发布的研究观点和市场展望。</li>
            <li><strong>新闻</strong>：主流财经媒体中与高盛相关的报道（系统会自动过滤和高盛无关的噪音）。</li>
            <li><strong>宏观指标</strong>：高盛经济学家对美联储利率、GDP 等宏观问题的最新判断。</li>
            <li><strong>自定义网页 / 主题订阅</strong>：在「设置」里添加你关心的网页或关键词主题，系统会一并盯梢，由 AI 预筛出相关内容。</li>
        </ul>
    </div>

    <div class="card" id="g-priority">
        <h3>四、信号优先级怎么看？</h3>
        <p>每条信号都会被自动评一个优先级，左侧筛选区可以按优先级过滤：</p>
        <ul>
            <li><span class="dot dot-high"></span><strong>高优先级</strong>：值得当天就看，比如大额持仓变动、高管变动、官方重大公告。这类信号的 AI 解读会在抓取后自动生成，直接展示在卡片下方，无需点击。</li>
            <li><span class="dot dot-medium"></span><strong>中优先级</strong>：有一定参考价值，扫一眼标题即可。</li>
            <li><span class="dot dot-low"></span><strong>低优先级</strong>：背景信息，知道有这回事就行。</li>
        </ul>
        <div class="tip">日常用法：只看「高优先级」加顶部 AI 日报，一分钟掌握全局；有空再展开中低优先级。</div>
    </div>

    <div class="card" id="g-pages">
        <h3>五、各个页面怎么用</h3>
        <h4>每日情报（默认页）</h4>
        <ul>
            <li><strong>顶部 AI 日报</strong>：当天所有信号的 AI 中文汇总，先读它。</li>
            <li><strong>今日情报列表</strong>：一条条原始信号。高优先级信号的 AI 解读已自动展开在卡片下方；中低优先级信号点「AI 解读」生成详解（结果有缓存，不重复消耗 AI 额度）。</li>
            <li><strong>查看日期</strong>：页面顶部可选择任意历史日期回溯当天的情报。</li>
            <li><strong>更早的情报</strong>：页面底部折叠区，展开可看最近 30 天。</li>
            <li><strong>重新生成日报</strong>：系统每小时自动抓取，抓到新情报后会自动重写日报，一般不用你操心。如果刚好在新情报入库、日报还没自动更新的间隙，卡片上会出现橙色提醒（"生成时只有 N 条，现在已有 M 条"），点卡片底部的「重新生成」可以不等定时任务、立刻让 AI 基于最新情报重写一份。</li>
        </ul>
        <h4>季度报告</h4>
        <ul>
            <li>页面顶部下拉框选择季度，下方标签栏可切换：<strong>全部</strong>（一屏到底的长页面，依次为：AI 季度洞察 → 重点标的分析 → 持仓变化 → 高优先级信号 → 前十大持仓）、<strong>概览</strong>（关键数据）、<strong>AI 分析</strong>（含 AI 季度洞察：调仓解读、A 股题材映射、宏观看点）、<strong>持仓变化</strong>（与上一季度对比：新建仓/增持/减持/清仓）、<strong>多源信号</strong>（当季相关情报）、<strong>持仓明细</strong>（默认按公司汇总，可切换"原始明细"）。</li>
            <li><strong>AI 季度洞察</strong>和<strong>重点标的分析</strong>都可以点「重新生成」刷新内容。</li>
        </ul>
        <h4>设置</h4>
        <ul>
            <li><strong>大模型管理</strong>：配置 AI 的 API Key（支持 Kimi 等 Anthropic 兼容接口），可添加多个模型并设置默认。</li>
            <li><strong>信号源开关</strong>：不想看的来源直接关掉，流水线会跳过它。</li>
            <li><strong>自定义源</strong>：添加自己的网页源 / 主题订阅，AI 会帮你预筛内容是否相关。</li>
        </ul>
        <h4>左侧两个按钮的区别</h4>
        <ul>
            <li><strong>运行每日情报</strong>：立刻抓取今天的多源信号并生成日报（平时系统每小时自动跑一次，这个按钮用于你想「现在就要」的时刻）。</li>
            <li><strong>运行季度对账</strong>：抓取最新的 13F 持仓并生成季度报告（系统每周一早 9 点自动检查一次有没有新的 13F 申报；13F 本身每季度才披露一次，所以平时大多空手而归，披露截止日后用它手动补跑即可）。</li>
        </ul>
        <p>两个按钮点击后都会出现<strong>实时进度面板</strong>：左侧显示流水线的四个步骤，右侧逐个信号源显示抓取状态（进行中 → 成功 / 失败），让你清楚知道系统正在做什么。</p>
    </div>

    <div class="card" id="g-freq">
        <h3>六、各板块更新频率</h3>
        <p>系统在后台有一个定时任务，自动保持各板块内容新鲜。下面是每个板块的更新节奏（全部为北京时间）：</p>
        <table>
            <tr><th>板块</th><th>更新频率</th><th>说明</th></tr>
            <tr><td><strong>每日情报信号</strong></td><td>每小时自动抓取一次（整点）</td><td>8-K、13D/13G、高盛研究、新闻、宏观、自定义源全部每小时扫一遍，只抓新内容</td></tr>
            <tr><td><strong>AI 每日日报</strong></td><td>抓到新情报后自动重新生成</td><td>没有新情报时不重复生成，不浪费 AI 额度</td></tr>
            <tr><td><strong>单条 AI 解读</strong></td><td>高优先级：抓取后自动生成；其它：手动点击生成</td><td>生成后缓存并自动展开（高优先级），重复看不消耗额度</td></tr>
            <tr><td><strong>13F 持仓（季度对账）</strong></td><td>每周一早 9 点自动检查</td><td>13F 本身每季度才披露一次（截止日 5/15、8/14、11/14、2/14），平时检查多为空跑</td></tr>
            <tr><td><strong>季度报告（AI 洞察、重点标的）</strong></td><td>生成后长期缓存</td><td>内容不会自动变，点「重新生成」才会更新</td></tr>
            <tr><td><strong>历史情报保留</strong></td><td>最近 90 天</td><td>更早的信号随每次抓取自动清理，历史日报和季度报告不受影响</td></tr>
        </table>
        <div class="tip">所有自动任务失败都不会影响你已保存的数据，下次到点会自动重试；手动按钮随时可用。</div>
    </div>

    <div class="card" id="g-faq">
        <h3>七、常见问题</h3>
        <p><strong>Q：为什么 13F 持仓数据是一两个月前的？</strong><br>
        A：这是 SEC 规则决定的，所有机构都一样，最长滞后 45 天。想更早发现重仓线索，多留意 13D/13G 信号。</p>
        <p><strong>Q：为什么有些新闻看起来和高盛关系不大？</strong><br>
        A：系统默认只保留与高盛相关的新闻并会定期清理噪音；如有个别漏网之鱼，可在设置里关闭「新闻」源，或调整自定义主题。</p>
        <p><strong>Q：日报里写的条数和下面的实际情报数量对不上？</strong><br>
        A：情报是全天陆续入库的。系统每小时抓到新情报后会自动重写日报，一般过一会儿数量就对上了；如果你正好卡在新情报刚入库、日报还没自动更新的间隙，卡片上会出现橙色提醒，点「重新生成」可立刻更新到最新内容。</p>
        <p><strong>Q：AI 解读和日报会重复消耗额度吗？</strong><br>
        A：不会重复消耗。单条解读和每日日报都有缓存，同一内容只调用一次 AI。会触发新调用的情况只有三种：高优先级信号抓取后自动生成解读、系统抓到新情报自动更新日报、你主动点「AI 解读」或「重新生成」。</p>
        <p><strong>Q：我的 API Key 安全吗？</strong><br>
        A：Key 只保存在你自己服务器的本地数据库里，不会外传；代码中也没有硬编码任何密钥。</p>
        <p><strong>Q：手机上功能完整吗？</strong><br>
        A：完整。点左上角 ☰ 展开菜单，所有功能都能使用。</p>

<script>
// ====== Auth: redirect to login on 401 for every API call ======
const _rawFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
    const resp = await _rawFetch(...args);
    if (resp.status === 401 && !String(args[0]).includes('/api/auth/')) {
        window.location.href = '/login';
    }
    return resp;
};

let currentUser = null; // {username, role}

// ====== State ======
let currentQuarter = null;
let reportData = null;
let reports = [];
let currentQuarterTab = 'all'; // 'all' = stacked long page
let currentInstitution = '';
let dailyData = [];       // signals from /api/signals/recent (earlier range view)
let todayData = [];       // today's signals (today view)
let dailyDays = 30;       // current day range
let currentView = 'daily'; // 'daily' | 'quarter'

// ====== Logout ======
async function logout() {
    try { await fetch('/api/auth/logout', {method: 'POST'}); } catch(e) { /* ignore */ }
    window.location.href = '/login';
}

// ====== Init ======
async function init() {
    onInstitutionChange();
    // Masthead date: today + weekday + issue number (day of year)
    const now = new Date();
    const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const issue = Math.floor((now - new Date(now.getFullYear(), 0, 1)) / 86400000) + 1;
    const dateEl = document.getElementById('mastheadDate');
    if (dateEl) {
        dateEl.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · ${weekDays[now.getDay()]} · 第 ${String(issue).padStart(3, '0')} 期`;
    }

    // Who am I? (middleware already guarantees a session; this drives role-based UI)
    try {
        const me = await (await fetch('/api/auth/me')).json();
        currentUser = me;
        const whoEl = document.getElementById('currentUser');
        if (whoEl) {
            const roleName = me.role === 'admin' ? '管理员' : '普通用户';
            whoEl.innerHTML = `${esc(me.username)}<span class="role-tag">${roleName}</span>`;
        }
        if (me.role !== 'admin') {
            const settingsNav = document.querySelector('#mainNav li[data-view="settings"]');
            if (settingsNav) settingsNav.style.display = 'none';
        }
    } catch(e) { console.error('Failed to load current user', e); }

    // Bind main nav (每日情报)
    document.querySelectorAll('#mainNav li').forEach(li => {
        li.addEventListener('click', () => switchMainView(li.dataset.view));
    });

    // Preload report list in background
    try {
        const resp = await fetch('/api/reports');
        reports = await resp.json();
        if (reports.length > 0) currentQuarter = reports[0].quarter;
    } catch(e) { console.error('Failed to load reports', e); }

    // Default: daily intel view
    await buildSourceFilters();
    await switchMainView('daily');
    syncPipelineButton();
}

let _sourceLabels = {};

async function buildSourceFilters() {
    try {
        const resp = await fetch('/api/settings/sources');
        const sources = await resp.json();
        const box = document.getElementById('sourceFilterBox');
        if (!box) return;
        const prev = new Set([...document.querySelectorAll('.filter-source:checked')].map(cb => cb.value));
        box.innerHTML = sources.map(s => {
            _sourceLabels[s.name] = s.label;
            const checked = prev.size === 0 || prev.has(s.name) ? 'checked' : '';
            return `<label><input type="checkbox" ${checked} onchange="onFilterChange()" class="filter-source" value="${esc(s.name)}"> ${esc(s.label)}</label>`;
        }).join('');
    } catch(e) { console.error('Failed to build source filters', e); }
}

let loadSeq = 0;

async function loadQuarter(quarter) {
    currentQuarter = quarter;
    const seq = ++loadSeq;
    document.getElementById('mainContent').innerHTML = '<div class="loading">加载中...</div>';

    try {
        const [reportResp, signalsResp] = await Promise.all([
            fetch(`/reports/${quarter}.html`),
            fetch(`/api/signals/${quarter}`),
        ]);
        const html = await reportResp.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Signals come from the JSON API (404 = this quarter has no signal run yet)
        let signals = [];
        let sourceStatus = {};
        let signalsError = false;
        if (signalsResp.ok) {
            const signalData = await signalsResp.json();
            signals = Array.isArray(signalData.signals) ? signalData.signals : [];
            sourceStatus = signalData.source_status || {};
        } else if (signalsResp.status !== 404) {
            signalsError = true;
        }

        // Ignore stale responses if the user clicked another quarter meanwhile
        if (seq !== loadSeq) return;

        // Analysis and holdings are still extracted from the static HTML report
        reportData = {
            quarter: quarter,
            generated_at: extractMeta(doc, '报告生成时间'),
            sentiment: extractMeta(doc, '情绪信号'),
            confidence: extractMeta(doc, '置信度'),
            analysis: {
                summary: extractSection(doc, '总体摘要'),
                concentration: extractSection(doc, '集中度分析'),
                topHoldings: extractSection(doc, '前十大重仓股分析'),
                sector: extractSection(doc, '行业偏好'),
                signals: extractSection(doc, '交易信号'),
                risks: extractSection(doc, '风险提示'),
                retail: extractSection(doc, '散户可借鉴思路'),
            },
            keyTickers: extractTickers(doc),
            signals: signals,
            sourceStatus: sourceStatus,
            signalsError: signalsError,
            holdings: extractHoldings(doc),
            holdingsTotal: extractHoldingsTotal(doc),
        };
    } catch(e) {
        if (seq !== loadSeq) return;
        console.error('Failed to load report', e);
        reportData = null;
    }

    renderQuarterView();
}

// ====== Manual pipeline trigger ======
function setRunMsg(text, cls) {
    const el = document.getElementById('runPipelineMsg');
    el.textContent = text;  // textContent, never innerHTML — error text is untrusted
    el.className = 'run-msg' + (cls ? ' ' + cls : '');
}

async function runPipeline() {
    const btn = document.getElementById('runPipelineBtn');
    btn.disabled = true;
    setRunMsg('正在启动…', 'info');
    try {
        const resp = await fetch('/api/pipeline/run', {method: 'POST'});
        if (resp.status === 409) {
            setRunMsg('流水线正在运行中，请稍候', 'info');
        } else if (!resp.ok) {
            setRunMsg('启动失败，请稍后重试', 'err');
            btn.disabled = false;
            return;
        }
        setRunMsg('流水线运行中…（通常需要几分钟）', 'info');
        showProgressPanel();
        attachPipelineStream();
    } catch (e) {
        setRunMsg('网络错误，无法启动', 'err');
        btn.disabled = false;
    }
}

let _pipelineEventSource = null;

function attachPipelineStream() {
    const btn = document.getElementById('runPipelineBtn');
    if (_pipelineEventSource) { _pipelineEventSource.close(); _pipelineEventSource = null; }
    _pipelineEventSource = new EventSource('/api/pipeline/run/stream');
    const sourceStates = {};
    const steps = {};

    _pipelineEventSource.onmessage = function(e) {
        try {
            const data = JSON.parse(e.data);
            if (data.event === 'start') {
                data.sources.forEach(s => { sourceStates[s] = {status: 'waiting', count: 0, error: ''}; });
                updatePipelinePanel(sourceStates, steps);
            } else if (data.event === 'step') {
                steps[data.step] = data;
                updatePipelinePanel(sourceStates, steps);
            } else if (data.event === 'source_done') {
                sourceStates[data.source] = {status: data.status, count: data.count, error: data.error || ''};
                updatePipelinePanel(sourceStates, steps);
            } else if (data.event === 'complete') {
                _pipelineEventSource.close();
                _pipelineEventSource = null;
                btn.disabled = false;
                const errCount = (data.errors || []).length;
                if (errCount) {
                    setRunMsg('部分完成：' + (data.signal_count || 0) + ' 条信号，' + errCount + ' 个源出错', 'err');
                } else {
                    setRunMsg('数据已更新：' + (data.signal_count || 0) + ' 条信号', 'ok');
                }
                updatePipelinePanel(sourceStates, steps, data);
                refreshReports();
            } else if (data.event === 'job_error') {
                _pipelineEventSource.close();
                _pipelineEventSource = null;
                btn.disabled = false;
                setRunMsg('运行失败：' + data.error, 'err');
                updatePipelinePanel(sourceStates, steps, {signal_count: 0, errors: [data.error]});
            }
        } catch(ex) { console.error('SSE parse error', ex); }
    };

    _pipelineEventSource.onerror = function() {
        // EventSource auto-reconnects; the server replays the job's event log,
        // so a proxy timeout mid-run just re-syncs the panel from the log.
        if (_pipelineEventSource) {
            setRunMsg('连接中断，正在重连…', 'info');
        }
    };
}

// ====== Quarterly reconciliation live progress panel ======
function updatePipelinePanel(sourceStates, steps, summary) {
    const panel = document.getElementById('progressPanel');
    if (!panel) return;
    const sourceLabels = {'13F': '13F 持仓', '8-K': 'SEC 8-K 重大事件', 'news': 'RSS 新闻', ..._sourceLabels};
    const statusColors = {'waiting': '#999', 'ok': '#2e7d32', 'error': '#d32f2f'};
    const stepOrder = ['holdings', 'analysis', 'comparison', 'report'];
    const stepDefaults = {'holdings': '抓取 13F 持仓', 'analysis': 'AI 持仓分析', 'comparison': '季度持仓对比', 'report': '生成季度报告'};

    let html = '<h3 class="prog-title">季度对账进度</h3>';

    html += '<div class="prog-step">';
    stepOrder.forEach(key => {
        const st = steps[key];
        const color = st && st.status === 'done' ? '#2e7d32' : st && st.status === 'error' ? '#d32f2f' : '#999';
        const label = st && st.label ? st.label : stepDefaults[key];
        html += `<div class="prog-row">
            <span style="color:${color};"><span class="dot" style="background:${color};"></span>${esc(label)}</span>
            <span class="prog-detail">${st && st.detail ? esc(st.detail) : ''}</span>
        </div>`;
    });
    html += '</div>';

    if (Object.keys(sourceStates).length) {
        html += '<div class="prog-more">';
        for (const [name, state] of Object.entries(sourceStates)) {
            const color = statusColors[state.status] || '#999';
            const label = sourceLabels[name] || name;
            html += `<div class="prog-row-lg">
                <span class="prog-label"><span class="dot" style="background:${color};"></span>${esc(label)}</span>
                <span class="prog-status" style="color:${color};">
                    ${state.status === 'ok' ? state.count + ' 条信号' : state.status === 'error' ? esc(state.error).substring(0,50) : '等待中'}
                </span>
            </div>`;
        }
        html += '</div>';
    }

    if (summary) {
        const errCount = (summary.errors || []).length;
        html += `<div class="prog-summary">
            <strong>运行报告</strong><br>
            <span class="prog-line">对账季度：${esc(summary.quarter || '')}</span><br>
            <span class="prog-line">信号总数：${summary.signal_count || 0} 条</span><br>
            <span class="prog-line ${errCount ? 'err' : 'ok'}">${errCount ? errCount + ' 个源出错' : '全部成功'}</span>
            ${(summary.errors || []).map(e => `<div class="prog-err-line">${esc(String(e)).substring(0, 120)}</div>`).join('')}
        </div>
        <button class="run-btn mt-12" onclick="document.getElementById('progressPanel').style.display='none'">关闭</button>`;
    }

    panel.innerHTML = html;
}

// ====== Manual daily intel trigger (SSE progress) ======
function setDailyMsg(text, cls) {
    const el = document.getElementById('runDailyMsg');
    el.textContent = text;
    el.className = 'run-msg' + (cls ? ' ' + cls : '');
}

let _dailyEventSource = null;

async function runDailyIntel() {
    const btn = document.getElementById('runDailyBtn');
    btn.disabled = true;
    setDailyMsg('正在启动…', 'info');

    // Show progress panel
    showProgressPanel();

    // Close any existing SSE connection
    if (_dailyEventSource) { _dailyEventSource.close(); _dailyEventSource = null; }

    // Use SSE for real-time progress
    _dailyEventSource = new EventSource('/api/pipeline/run-daily/stream');
    const sourceStates = {};

    _dailyEventSource.onmessage = function(e) {
        try {
            const data = JSON.parse(e.data);
            if (data.event === 'start') {
                data.sources.forEach(s => {
                    sourceStates[s] = {status: 'waiting', count: 0, error: ''};
                });
                updateProgressPanel(sourceStates);
            } else if (data.event === 'source_done') {
                sourceStates[data.source] = {status: data.status, count: data.count, error: data.error || ''};
                updateProgressPanel(sourceStates);
            } else if (data.event === 'triage_note') {
                (sourceStates.__notes = sourceStates.__notes || []).push(data);
                updateProgressPanel(sourceStates);
            } else if (data.event === 'complete') {
                _dailyEventSource.close();
                _dailyEventSource = null;
                btn.disabled = false;
                const totalNew = data.new_signals || 0;
                const hasErrors = (data.errors || []).length > 0;
                if (hasErrors) {
                    setDailyMsg('部分完成：' + totalNew + ' 条新信号，' + data.errors.length + ' 个源出错', 'err');
                } else {
                    setDailyMsg('情报已更新：' + totalNew + ' 条新信号', 'ok');
                }
                updateProgressPanel(sourceStates, true, data);
                // Reload the active daily view (today view by default)
                setTimeout(() => {
                    if (document.getElementById('todayFeed')) loadTodayView();
                    else loadDailyIntel(dailyDays || 30);
                }, 1500);
            }
        } catch(ex) { console.error('SSE parse error', ex); }
    };

    _dailyEventSource.onerror = function(e) {
        if (_dailyEventSource) {
            _dailyEventSource.close();
            _dailyEventSource = null;
        }
        btn.disabled = false;
        setDailyMsg('SSE 连接中断，请手动刷新页面查看结果', 'err');
        updateProgressPanel(sourceStates, true);
    };
}

function showProgressPanel() {
    let panel = document.getElementById('progressPanel');
    if (panel) { panel.style.display = 'block'; panel.innerHTML = '<div class="loading">正在启动...</div>'; return; }

    panel = document.createElement('div');
    panel.id = 'progressPanel';
    panel.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--rule);border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,0.12);padding:24px;z-index:1000;min-width:340px;max-width:90vw;';
    panel.innerHTML = '<div class="loading">正在启动...</div>';
    document.body.appendChild(panel);
}

function updateProgressPanel(sourceStates, isComplete, summary) {
    const panel = document.getElementById('progressPanel');
    if (!panel) return;

    const sourceLabels = {'8-K':'SEC 8-K 重大事件','13D/13G':'13D/13G 大动作','research_view':'高盛研究观点','news':'RSS 新闻','macro_view':'FRED 宏观', ..._sourceLabels};
    const statusColors = {'waiting':'#999','ok':'#2e7d32','error':'#d32f2f'};

    let html = '<h3 class="prog-title">每日情报抓取进度</h3>';
    for (const [name, state] of Object.entries(sourceStates)) {
        if (name === '__notes') continue;
        const color = statusColors[state.status] || '#999';
        const label = sourceLabels[name] || name;
        html += `<div class="prog-row-lg">
            <span class="prog-label"><span class="dot" style="background:${color};"></span>${esc(label)}</span>
            <span class="prog-status" style="color:${color};">
                ${state.status === 'ok' ? state.count + ' 条信号' : state.status === 'error' ? esc(state.error).substring(0,50) : '等待中'}
            </span>
        </div>`;
    }

    (sourceStates.__notes || []).forEach(n => {
        html += `<div class="prog-err-line">${esc(sourceLabels[n.source] || n.source)}：${esc(n.note)}</div>`;
    });

    if (isComplete && summary) {
        html += `<div class="prog-summary">
            <strong>运行报告</strong><br>
            <span class="prog-line">新增信号：${summary.new_signals || 0} 条</span><br>
            <span class="prog-line">参与评分：${summary.total_scored || 0} 条</span><br>
            <span class="prog-line ${(summary.errors||[]).length ? 'err' : 'ok'}">${(summary.errors||[]).length ? summary.errors.length + ' 个源出错' : '全部成功'}</span>
        </div>
        <button class="run-btn mt-12" onclick="document.getElementById('progressPanel').style.display='none'">关闭</button>`;
    }

    panel.innerHTML = html;
}

async function refreshReports() {
    try {
        const resp = await fetch('/api/reports');
        reports = await resp.json();
        if (reports.length > 0) {
            currentQuarter = reports[0].quarter;  // newest first — a new run may add a quarter
            await switchMainView('quarter');
        }
    } catch (e) { console.error('Failed to refresh reports', e); }
}

// If a pipeline is already running when the page opens, attach to its live stream
async function syncPipelineButton() {
    try {
        const st = await (await fetch('/api/pipeline/status')).json();
        if (st.running) {
            document.getElementById('runPipelineBtn').disabled = true;
            setRunMsg('流水线运行中…（通常需要几分钟）', 'info');
            showProgressPanel();
            attachPipelineStream();
        }
    } catch (e) { /* status endpoint unreachable — leave button as-is */ }
    try {
        const ds = await (await fetch('/api/pipeline/run-daily/status')).json();
        if (ds.running) {
            document.getElementById('runDailyBtn').disabled = true;
            setDailyMsg('正在抓取最新信号…', 'info');
        }
    } catch (e) { /* status endpoint unreachable — leave button as-is */ }
}

// ====== Data extractors from static HTML ======
function extractMeta(doc, label) {
    const ps = doc.querySelectorAll('p');
    for (const p of ps) {
        if (p.textContent.includes(label)) {
            return p.textContent.replace(label + '：', '').replace(label + ':', '').trim();
        }
    }
    return '';
}

// Old reports merged sentiment and confidence into one <p>, so the raw strings
// can be like "偏多（科技板块）（置信度：85%）". Parse defensively.
function parseConfidence(raw) {
    if (!raw) return 0;
    const s = String(raw);
    let v = parseFloat(s.replace(/[%％]/g, ''));
    if (isNaN(v)) {
        const m = s.match(/(\d+(?:\.\d+)?)\s*[%％]/);
        v = m ? parseFloat(m[1]) : NaN;
    }
    if (isNaN(v)) return 0;
    if (v > 1) v = v / 100;
    return Math.min(Math.max(v, 0), 1);
}

function cleanSentiment(raw) {
    if (!raw) return '—';
    const s = String(raw)
        .replace(/（置信度[^）]*）/g, '')
        .replace(/\(置信度[^)]*\)/g, '')
        .trim();
    return s || '—';
}

function extractSection(doc, label) {
    const spans = doc.querySelectorAll('.label');
    for (const s of spans) {
        if (s.textContent.includes(label)) {
            return s.parentElement.textContent.replace(label + '：', '').replace(label + ':', '').trim();
        }
    }
    return '暂无数据';
}

function extractTickers(doc) {
    const h2s = doc.querySelectorAll('h2');
    for (const h2 of h2s) {
        if (h2.textContent.includes('重点标的')) {
            const card = h2.closest('.card');
            if (card) {
                const p = card.querySelector('p');
                return p ? p.textContent.split(',').map(s => s.trim()).filter(Boolean) : [];
            }
        }
    }
    return [];
}

function extractHoldings(doc) {
    const holdings = [];
    const table = doc.querySelector('table');
    if (!table) return holdings;
    const rows = table.querySelectorAll('tbody tr');
    rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length >= 2) {
            holdings.push({
                name: cells[0].textContent.trim(),
                value: cells[1].textContent.trim(),
            });
        }
    });
    return holdings;
}

// The static report embeds only the top positions and stamps the full count
// on the table; 0 means "unknown / old report without the attribute".
function extractHoldingsTotal(doc) {
    const table = doc.querySelector('table[data-total-holdings]');
    if (!table) return 0;
    const n = Number(table.dataset.totalHoldings);
    return Number.isFinite(n) ? n : 0;
}

// ====== Quarter view render (selector + in-content tabs + panels) ======
const QUARTER_TABS = [
    ['all', '全部'],
    ['overview', '概览'],
    ['analysis', 'AI 分析'],
    ['changes', '持仓变化'],
    ['signals', '多源信号'],
    ['holdings', '持仓明细'],
];

function previousQuarterOf(q) {
    const i = reports.findIndex(r => r.quarter === q);
    return (i >= 0 && i + 1 < reports.length) ? reports[i + 1].quarter : '';
}

function renderQuarterView() {
    const main = document.getElementById('mainContent');
    if (!reportData) {
        main.innerHTML = '<div class="empty-state"><p>暂无数据</p></div>';
        return;
    }
    const options = reports.map((r, i) =>
        `<option value="${r.quarter}" ${r.quarter === currentQuarter ? 'selected' : ''}>${r.quarter}${i === 0 ? '（最新）' : ''}</option>`
    ).join('');
    main.innerHTML = `
        <div class="daily-header">
            <h2>季度报告</h2>
            <div class="date-picker-row">
                <span>选择季度：</span>
                <select id="quarterSelect" onchange="loadQuarter(this.value)">${options}</select>
            </div>
        </div>
        <div class="quarter-tabs">${QUARTER_TABS.map(([k, label]) =>
            `<button class="quarter-tab ${k === currentQuarterTab ? 'active' : ''}" data-qtab="${k}">${label}</button>`
        ).join('')}</div>
        <div id="quarterPanel"></div>`;
    document.querySelectorAll('.quarter-tab').forEach(b =>
        b.addEventListener('click', () => switchQuarterTab(b.dataset.qtab))
    );
    renderQuarterPanel();
}

function switchQuarterTab(tab) {
    currentQuarterTab = tab;
    document.querySelectorAll('.quarter-tab').forEach(b =>
        b.classList.toggle('active', b.dataset.qtab === tab)
    );
    renderQuarterPanel();
}

function renderQuarterPanel() {
    const el = document.getElementById('quarterPanel');
    if (!el || !reportData) return;
    const d = reportData;
    const filterSection = document.getElementById('signalFilterSection');
    const showFilter = currentQuarterTab === 'signals';
    if (filterSection && currentView === 'quarter') filterSection.style.display = showFilter ? 'block' : 'none';

    switch (currentQuarterTab) {
        case 'overview':
            el.innerHTML = renderOverview(d);
            break;
        case 'analysis':
            el.innerHTML = '<div id="insightSlot"><div class="loading">AI 季度洞察生成中...</div></div>' + renderAnalysis(d);
            loadQuarterInsight(d);
            break;
        case 'changes':
            el.innerHTML = '<div class="loading">加载中...</div>';
            loadQuarterChanges(d, el);
            break;
        case 'signals':
            el.innerHTML = renderSignalsPanel(d);
            renderSignals();
            break;
        case 'holdings':
            el.innerHTML = renderHoldingsPanel(d);
            break;
        case 'all':
        default:
            el.innerHTML = '<div id="insightSlot"><div class="loading">AI 季度洞察生成中...</div></div>'
                + '<div id="tickerSlot"><div class="loading">重点标的分析生成中...</div></div>'
                + '<div id="changesSlot"><div class="loading">加载中...</div></div>'
                + renderHighSignalsCard(d)
                + renderTopHoldingsCard(d);
            loadQuarterInsight(d);
            loadTickerProfiles(d);
            loadQuarterChanges(d, document.getElementById('changesSlot'));
            break;
    }
}

async function loadQuarterInsight(d, force = false) {
    const slot = document.getElementById('insightSlot');
    if (!slot) return;
    const prev = previousQuarterOf(d.quarter);
    if (force) slot.innerHTML = '<div class="loading">AI 季度洞察重新生成中...</div>';
    try {
        const query = prev ? `?previous=${prev}` : '';
        const resp = force
            ? await fetch(`/api/quarter-insight/${d.quarter}/regenerate${query}`, { method: 'POST' })
            : await fetch(`/api/quarter-insight/${d.quarter}${query}`);
        const r = await resp.json();
        if (r.report) {
            const formatted = formatMd(r.report);
            slot.innerHTML = `<div class="daily-report-card">
                <h3>${d.quarter} AI 季度洞察</h3>
                <div>${formatted}</div>
                <div class="mt-10"><button class="btn-sm" onclick="loadQuarterInsight(reportData, true)">重新生成</button></div>
            </div>`;
        } else {
            slot.innerHTML = '';
        }
    } catch (e) {
        slot.innerHTML = '<p class="muted">AI 季度洞察加载失败</p>';
    }
}

// ====== Key ticker profiles (AI-generated basic intro per top holding) ======

    const slot = document.getElementById('tickerSlot');

    if (force) slot.innerHTML = '<div class="loading">重点标的分析重新生成中...</div>';
    try {
        const resp = force

            : await fetch(`/api/ticker-profiles/${d.quarter}`);

function renderChangesCard(quarter, previous, r) {
    if (r.message) {
        return `<div class="card"><h3>持仓变化（${quarter} vs ${previous}）</h3><p class="muted">上一季度暂无持仓数据，无法进行环比对比。</p></div>`;
    }
    const hhi = Number(r.concentration_change || 0);
    const hhiText = `${hhi >= 0 ? '+' : ''}${hhi.toFixed(4)}（${hhi > 0 ? '持仓更集中' : hhi < 0 ? '持仓更分散' : '基本持平'}）`;
    const pct = it => {
        const prev = Number(it.value_prev), cur = Number(it.value);
        if (!prev) return '';
        const p = ((cur - prev) / prev * 100).toFixed(0);
        return `${fmtYi(prev)} → ${fmtYi(cur)}（${p > 0 ? '+' : ''}${p}%）`;
    };
    return `<div class="card mb-14">
            <h3>持仓变化（${quarter} vs ${previous}）</h3>
            <p class="card-note">金额单位：美元 · 增减持阈值为市值变动 ±20% · 集中度变化：${hhiText}</p>
        </div>
        <div class="change-grid">
            ${renderChangeGroup('🆕 新建仓', r.new_positions, it => fmtYi(it.value), 'new')}
            ${renderChangeGroup('增持', r.increased_positions, pct, 'inc')}
            ${renderChangeGroup('减持', r.decreased_positions, pct, 'dec')}
            ${renderChangeGroup('清仓', r.sold_positions, it => fmtYi(it.value), 'sold')}
        </div>`;
}

function renderSignals() {
    const container = document.getElementById('signalsContainer');
    if (!container || !reportData) return;

    const activeSources = [...document.querySelectorAll('.filter-source:checked')].map(cb => cb.value);
    const activeStrengths = [...document.querySelectorAll('.filter-strength:checked')].map(cb => cb.value);

    let filtered = reportData.signals.filter(s => {
        const srcMatch = activeSources.includes(s.source);
        const strMatch = activeStrengths.includes(s.strength);
        return srcMatch && strMatch;
    });

    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>没有匹配的信号，试试调整筛选条件</p></div>';
        return;
    }

    const grouped = { high: [], medium: [], low: [] };
    filtered.forEach(s => {
        const key = Object.prototype.hasOwnProperty.call(grouped, s.strength) ? s.strength : 'low';
        grouped[key].push(s);
    });

    let html = '';
    for (const [level, signals] of Object.entries(grouped)) {
        if (signals.length === 0) continue;
        const dotClass = level === 'high' ? 'dot-high' : level === 'medium' ? 'dot-medium' : 'dot-low';
        const label = level === 'high' ? '高优先级' : level === 'medium' ? '中优先级' : '低优先级';
        html += `<div class="card"><h3><span class="dot ${dotClass}"></span>${label}信号 (${signals.length})</h3>`;
        signals.forEach(s => { html += renderSignalCard(s); });
        html += '</div>';
    }
    container.innerHTML = html;
}

// Escape external content (RSS/SEC-derived) before injecting into innerHTML
function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
}

// Render the small markdown subset LLM output uses: headings, bold, hr.
function formatMd(text) {
    return esc(text)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/^#### (.+)$/gm, '<h5>$1</h5>')
        .replace(/^### (.+)$/gm, '<h4>$1</h4>')
        .replace(/^## (.+)$/gm, '<h4>$1</h4>')
        .replace(/^(?:---|\*\*\*)\s*$/gm, '<hr>')
        .replace(/\n/g, '<br>');
}

function safeHttpUrl(u) {
    return /^https?:\/\//i.test(u || '') ? u : null;
}

function renderSignalCard(s) {
    const date = formatSignalDate(s.published_at);
    const hasCrossRefs = s.cross_refs && s.cross_refs.length > 0;
    const strength = ['high', 'medium', 'low'].includes(s.strength) ? s.strength : 'low';
    const link = safeHttpUrl(s.url);
    const companies = Array.isArray(s.companies) ? s.companies : [];
    return `
        <div class="signal-card ${strength}" data-signal-id="${esc(s.id || '')}">
            <div class="sig-header">
                <span class="sig-source ${srcClass(s.source)}">${esc(s.source)}</span>
                <span class="sig-date">${esc(date)}</span>
            </div>
            <h4>${esc(s.title)}</h4>
            <p class="sig-summary">${esc(s.summary)}</p>
            <button type="button" class="sig-expand-btn" style="display:none" onclick="toggleSummary(this)">展开全文 ▾</button>
            <div class="sig-meta">
                ${companies.length ? `<span>${companies.map(esc).join(', ')}</span>` : ''}
                ${hasCrossRefs ? '<span class="cross-badge">交叉信号</span>' : ''}
                ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener" class="sig-link">查看原文 →</a>` : ''}
            </div>
        </div>
    `;
}

function formatSignalDate(publishedAt) {
    if (!publishedAt) return '';
    const dt = new Date(publishedAt);
    return isNaN(dt) ? String(publishedAt).slice(0, 10) : dt.toLocaleDateString('zh-CN');
}

// Fetch the complete holdings list on demand; the static report only embeds
// the top positions so quarter switching stays fast on a 5 Mbps uplink.
async function loadFullHoldings() {
    const btn = document.getElementById('loadAllHoldingsBtn');
    if (!reportData) return;
    if (btn) { btn.disabled = true; btn.textContent = '加载中…'; }
    try {
        const resp = await fetch(`/api/holdings/${reportData.quarter}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        reportData.holdings = (data.holdings || []).map(h => ({
            name: h.name,
            value: formatHoldingsValue(h.value),
        }));
        reportData.holdingsTotal = data.total || reportData.holdings.length;
        renderQuarterPanel();
    } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = '加载失败，点击重试'; }
    }
}

function parseHoldingsValue(text) {
    const n = Number(String(text).replace(/[^0-9.-]/g, ''));
    return Number.isFinite(n) ? n : 0;
}

function formatHoldingsValue(n) {
    return Math.round(n).toLocaleString('en-US');
}

function aggregateHoldingsByName(holdings) {
    const byName = new Map();
    holdings.forEach(h => {
        if (!byName.has(h.name)) byName.set(h.name, { name: h.name, value: 0, count: 0 });
        const agg = byName.get(h.name);
        agg.value += parseHoldingsValue(h.value);
        agg.count += 1;
    });
    return Array.from(byName.values()).sort((a, b) => b.value - a.value);
}

// ====== Main view switcher ======
async function switchMainView(view) {
    if (view === 'settings' && currentUser && currentUser.role !== 'admin') {
        return; // 非管理员无设置入口（服务端接口同样被拦截）
    }
    currentView = view;
    // Highlight sidebar nav
    document.querySelectorAll('#mainNav li').forEach(li => li.classList.remove('active'));
    const navItem = document.querySelector(`#mainNav li[data-view="${view}"]`);
    if (navItem) navItem.classList.add('active');

    const filterSection = document.getElementById('signalFilterSection');

    if (view === 'daily') {
        if (filterSection) filterSection.style.display = 'block';
        await loadTodayView();
    } else if (view === 'quarter') {
        if (filterSection) filterSection.style.display = 'block';
        if (currentQuarter) {
            await loadQuarter(currentQuarter);
        } else {
            document.getElementById('mainContent').innerHTML = '<div class="loading">暂无报告数据，请先运行季度对账</div>';
        }
    } else if (view === 'settings') {
        if (filterSection) filterSection.style.display = 'none';
        await renderSettings();
    } else if (view === 'guide') {
        if (filterSection) filterSection.style.display = 'none';
        renderGuide();
    }
}

}

async function toggleEarlier() {

function instBadge(instId) {

async function loadDailyIntel(days) {
    dailyDays = days;
    const target = document.getElementById('earlierBody') || document.getElementById('mainContent');
    target.innerHTML = '<div class="loading">加载中...</div>';

    // Highlight active day button
    document.querySelectorAll('.day-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.days) === days);
    });

    try {
        const resp = await fetch(`/api/signals/recent?days=${days}&institution=${currentInstitution}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        dailyData = json.signals || [];
    } catch (e) {
        console.error('Failed to load daily intel', e);
        dailyData = [];
    }
    renderDailyIntel();
}

function renderDailyIntel() {
    const filtered = filterDailySignals();
    const highCount = filtered.filter(s => s.strength === 'high').length;
    const sources = new Set(filtered.map(s => s.source));
    const dayLabel = {7:'最近 7 天',14:'最近 14 天',30:'最近 30 天',90:'最近 90 天'}[dailyDays] || `最近 ${dailyDays} 天`;

    const target = document.getElementById('earlierBody') || document.getElementById('mainContent');
    if (dailyData.length === 0 && filtered.length === 0) {
        target.innerHTML = `
            <div class="daily-header">
                <h2>每日情报</h2>
                <div class="day-selector">
                    ${[7,14,30,90].map(d => `<button class="day-btn${d===dailyDays?' active':''}" data-days="${d}" onclick="loadDailyIntel(${d})">${d} 天</button>`).join('')}
                </div>
            </div>
            <div class="empty-state">
                    <p>暂无最近情报</p>
                <p class="feed-hint">点击左侧「运行每日情报」开始抓取</p>
            </div>`;
        return;
    }

    let html = `
        <div class="daily-header">
            <h2>每日情报</h2>
            <div class="day-selector">
                ${[7,14,30,90].map(d => `<button class="day-btn${d===dailyDays?' active':''}" data-days="${d}" onclick="loadDailyIntel(${d})">${d} 天</button>`).join('')}
            </div>
        </div>
        <div class="daily-stats">
            <div class="stat-card"><div class="num">${filtered.length}</div><div class="label">情报总数</div></div>
            <div class="stat-card"><div class="num danger">${highCount}</div><div class="label">高优先级</div></div>
            <div class="stat-card"><div class="num">${sources.size}</div><div class="label">活跃信号源</div></div>
            <div class="stat-card"><div class="num small">${dayLabel}</div><div class="label">时间范围</div></div>
        </div>
        <div class="daily-feed">
            ${filtered.map(s => renderSignalCard(s)).join('')}
        </div>`;

    target.innerHTML = html;
}

function filterDailySignals() {
    const activeSources = [...document.querySelectorAll('.filter-source:checked')].map(cb => cb.value);
    const activeStrengths = [...document.querySelectorAll('.filter-strength:checked')].map(cb => cb.value);
    return dailyData.filter(s => activeSources.includes(s.source) && activeStrengths.includes(s.strength));
}

// ====== User management ======
async function loadUserList() {
    const container = document.getElementById('userList');
    if (!container) return;
    try {
        const resp = await fetch('/api/settings/users');
        const users = await resp.json();
        if (users.length === 0) {
            container.innerHTML = '<p class="muted">暂无用户</p>';
            return;
        }
        container.innerHTML = users.map(u => {
            const isBuiltin = u.username === 'gsadmin';
            const isSelf = currentUser && u.username === currentUser.username;
            const roleName = u.role === 'admin' ? '管理员' : '普通用户';
            const toggleRole = u.role === 'admin' ? 'viewer' : 'admin';
            const toggleLabel = u.role === 'admin' ? '设为普通用户' : '设为管理员';
            return `<div class="model-row">
                <div class="info">
                    <div class="model-name">${esc(u.username)}
                        ${u.role === 'admin' ? '<span class="badge-default">管理员</span>' : ''}
                        ${isBuiltin ? '<span class="builtin-note">（内置账号）</span>' : ''}
                    </div>
                    <div class="model-detail">角色：${roleName} · 创建于 ${esc((u.created_at || '').slice(0, 10))}</div>
                </div>
                <div>
                    <button class="btn-sm" onclick="resetUserPassword('${esc(u.username)}')">重置密码</button>
                    ${!isBuiltin ? `<button class="btn-sm" onclick="changeUserRole('${esc(u.username)}','${toggleRole}')">${toggleLabel}</button>` : ''}
                    ${!isBuiltin && !isSelf ? `<button class="btn-sm danger" onclick="deleteUser('${esc(u.username)}')">删除</button>` : ''}
                </div>
            </div>`;
        }).join('');
    } catch(e) { container.innerHTML = '<p class="muted">加载失败</p>'; }
}

function setUserMsg(text, isErr) {
    const el = document.getElementById('userFormMsg');
    if (el) { el.textContent = text; el.style.color = isErr ? 'var(--danger)' : 'var(--success)'; }
}

async function addUser() {
    const username = document.getElementById('newUserName').value.trim();
    const password = document.getElementById('newUserPassword').value;
    const role = document.getElementById('newUserRole').value;
    if (!username || !password) { setUserMsg('请填写用户名和密码', true); return; }
    try {
        const resp = await fetch('/api/settings/users', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password, role}),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) { setUserMsg(data.detail || '添加失败', true); return; }
        setUserMsg(`用户 ${username} 已添加`, false);
        document.getElementById('newUserName').value = '';
        document.getElementById('newUserPassword').value = '';
        loadUserList();
    } catch(e) { setUserMsg('网络错误，请重试', true); }
}

async function resetUserPassword(username) {
    const password = prompt(`为用户「${username}」设置新密码：`);
    if (!password) return;
    try {
        const resp = await fetch('/api/settings/users/' + encodeURIComponent(username), {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({password}),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) { alert(data.detail || '重置失败'); return; }
        setUserMsg(`已重置 ${username} 的密码（该用户需重新登录）`, false);
    } catch(e) { alert('网络错误，请重试'); }
}

async function changeUserRole(username, role) {
    try {
        const resp = await fetch('/api/settings/users/' + encodeURIComponent(username), {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({role}),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) { alert(data.detail || '修改失败'); return; }
        loadUserList();
    } catch(e) { alert('网络错误，请重试'); }
}

async function deleteUser(username) {
    if (!confirm(`确定要删除用户「${username}」吗？`)) return;
    try {
        const resp = await fetch('/api/settings/users/' + encodeURIComponent(username), {method: 'DELETE'});
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) { alert(data.detail || '删除失败'); return; }
        setUserMsg(`用户 ${username} 已删除`, false);
        loadUserList();
    } catch(e) { alert('网络错误，请重试'); }
}

async function loadLLMModelList() {
    const container = document.getElementById('llmModelList');
    if (!container) return;

async function toggleSource(name, enable) {
    try {
        const resp = await fetch('/api/settings/sources');
        const sources = await resp.json();
        const updated = sources.map(s => s.name === name ? {...s, enabled: enable} : s);
        await fetch('/api/settings/sources', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(updated)});
        renderSettings();
    } catch(e) { alert('保存失败: ' + e); }
}

// ====== Custom source form ======
let _editingSourceName = null;

function _csPolicy() {
    return document.querySelector('input[name="csPolicy"]:checked').value;
}

function onCsTypeChange() {
    const t = document.getElementById('csType').value;
    document.getElementById('csInstruction').style.display = (t === 'rss') ? 'none' : '';
    document.getElementById('csUrl').style.display = (t === 'topic') ? 'none' : '';
    document.getElementById('csInstruction').placeholder =
        t === 'topic' ? '搜索主题（如：高盛对中国股市的最新观点）'
                      : '提取说明（如：提取页面中高盛的市场观点与目标价）';
}

function resetCustomSourceForm() {
    _editingSourceName = null;
    document.getElementById('csFormTitle').textContent = '添加自定义信息源';
    document.getElementById('csLabel').value = '';
    document.getElementById('csName').value = '';
    document.getElementById('csName').disabled = false;
    document.getElementById('csType').value = 'rss';
    document.getElementById('csUrl').value = '';
    document.getElementById('csInstruction').value = '';
    document.getElementById('csCancelBtn').style.display = 'none';
    document.getElementById('csTestResult').textContent = '';
    onCsTypeChange();
}

async function saveCustomSource() {
    const label = document.getElementById('csLabel').value.trim();
    const url = document.getElementById('csUrl').value.trim();
    const body = {
        label, url,
        type: document.getElementById('csType').value,
        instruction: document.getElementById('csInstruction').value.trim(),
        filter_policy: _csPolicy(),
    };
    let resp;
    if (_editingSourceName) {
        resp = await fetch('/api/settings/sources/custom/' + encodeURIComponent(_editingSourceName), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    } else {
        const name = document.getElementById('csName').value.trim();
        if (!name) { alert('请填写标识（小写英文）'); return; }
        resp = await fetch('/api/settings/sources/custom', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...body, name})});
    }
    const data = await resp.json();
    if (!resp.ok) { alert('保存失败: ' + (data.detail || resp.status)); return; }
    resetCustomSourceForm();
    renderSettings();
    buildSourceFilters();
}

async function editCustomSource(name) {
    const sources = await (await fetch('/api/settings/sources')).json();
    const s = sources.find(x => x.name === name);
    if (!s) return;
    _editingSourceName = name;
    document.getElementById('csFormTitle').textContent = '编辑自定义源：' + s.label;
    document.getElementById('csLabel').value = s.label;
    document.getElementById('csName').value = s.name;
    document.getElementById('csName').disabled = true;
    document.getElementById('csType').value = s.type || 'rss';
    document.getElementById('csUrl').value = s.url || '';
    document.getElementById('csInstruction').value = s.instruction || '';
    onCsTypeChange();
    document.querySelector(`input[name="csPolicy"][value="${s.filter_policy || 'gs_only'}"]`).checked = true;
    document.getElementById('csCancelBtn').style.display = 'inline-block';
    document.getElementById('customSourceForm').scrollIntoView({behavior: 'smooth'});
}

async function deleteCustomSource(name) {
    if (!confirm('确定删除该自定义源？其历史情报保留，但不再抓取新内容。')) return;
    const resp = await fetch('/api/settings/sources/custom/' + encodeURIComponent(name), {method:'DELETE'});
    if (!resp.ok) { const e = await resp.json(); alert('删除失败: ' + e.detail); return; }
    renderSettings();
    buildSourceFilters();
}

async function testCustomSource() {
    const url = document.getElementById('csUrl').value.trim();
    const box = document.getElementById('csTestResult');
    const t = document.getElementById('csType').value;
    if (t !== 'topic' && !url) { box.textContent = '请先填写地址'; return; }
    if (t === 'topic' && !document.getElementById('csInstruction').value.trim()) { box.textContent = '请先填写搜索主题'; return; }
    const body = {
        url,
        type: document.getElementById('csType').value,
        instruction: document.getElementById('csInstruction').value.trim(),
        filter_policy: _csPolicy(),
        label: document.getElementById('csLabel').value.trim(),
    };
    box.textContent = '正在抓取并预览 AI 预筛…';
    try {
        const resp = await fetch('/api/settings/sources/test', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
        const data = await resp.json();
        if (!resp.ok) { box.textContent = (data.detail || '请求失败'); return; }
        if (!data.ok) { box.textContent = (data.error || '抓取失败'); return; }
        if (data.count === 0) {
            box.textContent = '地址可访问但没有符合条件的内容' + (data.note ? `（${data.note}）` : '，请确认地址和策略是否正确');
            return;
        }
        const kept = (data.items || []).filter(i => i.kept).length;
        let head = `抓取 ${data.count} 条`;
        if (data.ai_used) head += `，AI 预筛保留 ${kept} 条`;
        if (data.note) head += `（${data.note}）`;
        const lines = (data.items || []).map(i => `<span class="dot" style="background:${i.kept ? '#2e7d32' : '#c62828'}"></span>${esc(i.title)}`).join('<br>');
        box.innerHTML = esc(head) + '<br>' + lines;
    } catch(e) { box.textContent = '网络错误: ' + e; }
}

async function addLLMModel() {
    const name = document.getElementById('newModelName').value.trim();
    const baseUrl = document.getElementById('newModelBaseUrl').value.trim();
    const authToken = document.getElementById('newModelToken').value.trim();

    if (!name || !baseUrl || !authToken || !modelName) { alert('请填写所有字段'); return; }
    try {
        const resp = await fetch('/api/settings/llm-models', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,base_url:baseUrl,auth_token:authToken,model_name:modelName})});
        if (!resp.ok) { const e=await resp.json(); alert('添加失败: '+e.detail); return; }
        document.getElementById('newModelName').value = '';
        document.getElementById('newModelBaseUrl').value = '';
        document.getElementById('newModelToken').value = '';
        document.getElementById('newModelId').value = '';
        loadLLMModelList();
    } catch(e) { alert('添加失败: ' + e); }
}

async function testLLMModel() {
    const baseUrl = document.getElementById('newModelBaseUrl').value.trim();
    const authToken = document.getElementById('newModelToken').value.trim();
    const modelName = document.getElementById('newModelId').value.trim();
    const el = document.getElementById('testResult');
    if (!baseUrl || !authToken || !modelName) { el.innerHTML='<div class="test-result err">请填写 Base URL、Auth Token 和模型ID</div>'; return; }
    el.innerHTML = '<div class="test-result pending">测试中...</div>';
    try {
        const resp = await fetch('/api/settings/llm-models/test', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({base_url:baseUrl,auth_token:authToken,model_name:modelName})});
        const r = await resp.json();
        if (r.status === 'ok') el.innerHTML = `<div class="test-result ok">连通成功！响应: ${esc(r.response)}</div>`;
        else el.innerHTML = `<div class="test-result err">失败: ${esc(r.error)}</div>`;
    } catch(e) { el.innerHTML = `<div class="test-result err">网络错误: ${e}</div>`; }

async function setDefaultModel(id) {
    try {
        await fetch(`/api/settings/llm-models/${id}/default`, {method:'PUT'});
        loadLLMModelList();
    } catch(e) { alert('设置失败: ' + e); }
}

async function deleteModel(id) {
    if (!confirm('确定删除此模型配置？')) return;
    try {
        const resp = await fetch(`/api/settings/llm-models/${id}`, {method:'DELETE'});
        if (!resp.ok) { const e=await resp.json(); alert('删除失败: ' + e.detail); return; }
        loadLLMModelList();
    } catch(e) { alert('删除失败: ' + e); }
}

// ====== Daily intel AI analysis + date picker ======
async function analyzeSignal(panel, signalId, title, summary, source) {
    if (!panel) return;
    if (panel.classList.contains('open')) { panel.classList.remove('open'); return; }
    panel.classList.add('open');
    if (panel.dataset.loaded === 'true') return;
    panel.innerHTML = '<span class="c-muted">AI 分析中...</span>';
    try {
        const resp = await fetch(`/api/signals/${signalId}/analyze`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title,summary,source})});
        if (!resp.ok) { panel.innerHTML = '<span class="c-danger">AI 分析失败</span>'; return; }
        const r = await resp.json();
        panel.innerHTML = formatMd(r.analysis);
        panel.dataset.loaded = 'true';
    } catch(e) { panel.innerHTML = '<span class="c-danger">网络错误</span>'; }
}

// Auto-show cached AI analysis on high-priority cards (the pipeline generates
// it at fetch time). 404 = not generated yet (e.g. older signals) — collapse
// back and leave the manual button; never auto-POST here so browsing history
// can't spend LLM quota unexpectedly.
async function autoLoadHighAnalysis(panel, signalId) {
    if (!panel) return;
    panel.classList.add('open');
    panel.innerHTML = '<span class="c-muted">AI 解读加载中...</span>';
    try {
        const resp = await fetch(`/api/signals/${signalId}/analysis`);
        if (!resp.ok) { panel.classList.remove('open'); panel.innerHTML = ''; return; }
        const r = await resp.json();
        panel.innerHTML = formatMd(r.analysis);
        panel.dataset.loaded = 'true';
    } catch(e) { panel.classList.remove('open'); panel.innerHTML = ''; }
}

async function loadDailyReport(dateStr, force) {
    const container = document.getElementById('dailyReportContainer');
    if (!container) return;
    container.innerHTML = force
        ? '<div class="loading">正在重新生成每日报告...</div>'
        : '<div class="loading">生成每日报告中...</div>';
    try {
        const resp = force
            ? await fetch(`/api/daily-report/${dateStr}/regenerate`, {method: 'POST'})
            : await fetch(`/api/daily-report/${dateStr}`);
        const r = await resp.json();
        if (r.report) {
            const formatted = formatMd(r.report);
            const staleHint = r.stale
                ? `<div class="stale-warn">这份摘要生成时只有 ${r.signal_count} 条情报，现在已有 ${r.current_signal_count} 条，可点击「重新生成」更新。</div>`
                : '';
            container.innerHTML = `<div class="daily-report-card">
                <h3>${dateStr} 每日情报摘要</h3>
                <div class="mt-8">${formatted}</div>
                ${staleHint}
                <div class="mt-10"><button class="btn-sm" onclick="loadDailyReport('${dateStr}', true)">重新生成</button></div>
            </div>`;
        } else {
            container.innerHTML = '';
        }
    } catch(e) { container.innerHTML = '<p class="muted">日报加载失败</p>'; }
}

// Expand/collapse for long summaries (clamped to 3 lines by CSS).
function toggleSummary(btn) {
    const card = btn.closest('.signal-card');
    const summary = card && card.querySelector('.sig-summary');
    if (!summary) return;
    const expanded = summary.classList.toggle('expanded');
    summary.classList.toggle('clamped', !expanded);
    btn.textContent = expanded ? '收起 ▴' : '展开全文 ▾';
}

// Show the expand button only when the summary actually overflows 3 lines.
function updateSummaryToggle(card) {
    const summary = card.querySelector('.sig-summary');
    const btn = card.querySelector('.sig-expand-btn');
    if (!summary || !btn || summary.classList.contains('expanded')) return;
    // line-clamp hides overflow without growing scrollHeight, so unclamp
    // briefly to measure the full height (sync — no paint in between).
    const clampedH = summary.clientHeight;
    summary.classList.add('measuring');
    const fullH = summary.scrollHeight;
    summary.classList.remove('measuring');
    const overflows = fullH > clampedH + 2;
    btn.style.display = overflows ? '' : 'none';
    summary.classList.toggle('clamped', overflows);
    // Let a click on the truncated summary itself expand it (once per card).
    if (overflows && !summary.dataset.clickBound) {
        summary.dataset.clickBound = '1';
        summary.addEventListener('click', () => {
            if (!summary.classList.contains('expanded')) toggleSummary(btn);
        });
    }
}

// Signal cards are injected via innerHTML on many paths; watch the DOM once
// so every view (today / earlier / date / quarterly) gets measured buttons.
const summaryToggleObserver = new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(node => {
        if (node.nodeType !== 1) return;
        if (node.matches && node.matches('.signal-card')) updateSummaryToggle(node);
        if (node.querySelectorAll) node.querySelectorAll('.signal-card').forEach(updateSummaryToggle);
    }));
});
summaryToggleObserver.observe(document.body, { childList: true, subtree: true });

// Add AI-analysis toggles to every signal card under a root element.
function addAiToggles(rootEl) {
    (rootEl || document).querySelectorAll('.signal-card').forEach(card => {
        const titleEl = card.querySelector('h4');
        if (!titleEl) return;
        const sigId = card.dataset.signalId;
        if (!sigId) return;

        // Check if AI toggle already exists
        if (card.querySelector('.ai-toggle')) return;

        const toggle = document.createElement('span');
        toggle.className = 'ai-toggle';
        toggle.textContent = 'AI 解读';
        toggle.onclick = function() {
            const title = titleEl.textContent || '';
            const summaryEl = card.querySelector('.sig-summary');
            const summary = summaryEl ? summaryEl.textContent : '';
            const sourceEl = card.querySelector('.sig-source');
            const source = sourceEl ? sourceEl.textContent : '';
            analyzeSignal(panel, sigId, title, summary, source);
        };
        card.appendChild(toggle);

        const panel = document.createElement('div');
        panel.className = 'ai-panel';
        panel.id = 'ai-' + sigId;
        card.appendChild(panel);

        // High-priority cards: show the pipeline-generated analysis directly.
        if (card.classList.contains('high')) autoLoadHighAnalysis(panel, sigId);
    });
}

// Override renderDailyIntel (earlier range view) to add AI toggles.
// Date picker lives in the today-view header; the daily report card is
// rendered at the top of the today view, not appended to the feed.
const _origRenderDailyIntel = renderDailyIntel;
renderDailyIntel = function() {
    _origRenderDailyIntel();
    addAiToggles(document.getElementById('earlierBody') || document.getElementById('mainContent'));
};

async function loadDateSignals(dateStr) {
    dailyDays = null;  // custom date mode
    document.getElementById('mainContent').innerHTML = '<div class="loading">加载中...</div>';
    try {
        const resp = await fetch(`/api/signals/date/${dateStr}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        dailyData = json.signals || [];

        // Build custom view for this date
        const filtered = filterDailySignals();
        const highCount = filtered.filter(s => s.strength === 'high').length;
        const sources = new Set(filtered.map(s => s.source));

        let html = `<div class="daily-header">
            <h2>${dateStr} 情报</h2>
            <div class="date-picker-row">
                <span>查看日期：</span>
                <input type="date" id="dailyDatePicker" value="${dateStr}" onchange="loadDateSignals(this.value)">
                <button class="btn-sm primary" onclick="loadDateSignals(document.getElementById('dailyDatePicker').value)">查看</button>
                <button class="btn-sm" onclick="loadDailyReport(document.getElementById('dailyDatePicker').value)">生成日报</button>
                <button class="btn-sm" onclick="loadTodayView()">← 返回今日</button>
            </div>
        </div>
        <div class="daily-stats">
            <div class="stat-card"><div class="num">${filtered.length}</div><div class="label">当日情报</div></div>
            <div class="stat-card"><div class="num danger">${highCount}</div><div class="label">高优先级</div></div>
            <div class="stat-card"><div class="num">${sources.size}</div><div class="label">活跃信号源</div></div>
            <div class="stat-card"><div class="num small">${dateStr}</div><div class="label">查看日期</div></div>
        </div>
        <div id="dailyReportContainer"></div>
        <div class="daily-feed">${filtered.map(s => renderSignalCard(s)).join('')}</div>`;

        document.getElementById('mainContent').innerHTML = html;

        addAiToggles(document.getElementById('mainContent'));
        loadDailyReport(dateStr);  // auto: cached -> instant; missing -> generated on demand
    } catch(e) { document.getElementById('mainContent').innerHTML = '<div class="empty-state"><p>加载失败: ' + e.message + '</p></div>'; }
}

// Keep the mobile topbar title in sync for ALL view switches, including
// programmatic ones (e.g. refreshReports after a pipeline completes).
const _origSwitchMainView = switchMainView;
switchMainView = async function(view) {
    const titleEl = document.getElementById('mobilePageTitle');
    if (titleEl) {
        const t = ({ daily: '每日情报', quarter: '季度报告', settings: '设置', guide: '使用指南' })[view];
        if (t) titleEl.textContent = t;
    }
    return _origSwitchMainView(view);
};

// ====== Mobile drawer ======
function toggleDrawer(force) {
    const sb = document.getElementById('leftRail');
    const mask = document.getElementById('mobileMask');
    if (!sb || !mask) return;
    const open = typeof force === 'boolean' ? force : !sb.classList.contains('open');
    sb.classList.toggle('open', open);
    mask.classList.toggle('open', open);
}

// Delegated listener; the topbar title is synced by the switchMainView
// wrapper above, so this only closes the drawer.
(function bindMobileNav() {
    const sb = document.getElementById('leftRail');
    if (!sb) return;
    sb.addEventListener('click', (e) => {
        const item = e.target.closest('#mainNav li');
        if (!item) return;
        toggleDrawer(false);
    });
})();

// ====== Boot ======
init();
</script>
