server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The 5 Mbps uplink is the bottleneck: quarterly reports are multi-MB HTML
    # tables that gzip ~10x smaller. text/html is compressed by default;
    # text/event-stream is deliberately NOT listed so SSE stays unbuffered.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Re-resolve the app container's IP at request time (Docker embedded DNS).
    # Without this, nginx resolves "app" once at startup and keeps proxying to
    # the old IP after the app container is recreated (=> 502 after deploys).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Auth is handled by the app (login page + session cookie). Static report
    # files would bypass that guard, so /reports/ is proxied to the app too.
    location /reports/ {
        set $gs_app_reports "http://app:8000";
        proxy_pass $gs_app_reports;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        # Variable proxy_pass forces runtime DNS resolution (see resolver above);
        # request URI is passed through unchanged, same as "http://app:8000/".
        set $gs_app_root "http://app:8000";
        proxy_pass $gs_app_root;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $gs_app_api "http://app:8000";
        proxy_pass $gs_app_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (pipeline progress streams): disable buffering so events flush
        # immediately, and allow long-lived connections — daily intel fetches
        # from CN can take minutes while sources respond one by one.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # /login is served by the app as well (no static assets need nginx caching).
    location / {
        set $gs_app_pages "http://app:8000";
        proxy_pass $gs_app_pages;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
